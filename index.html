<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>周盼盼的小相册</title>
<meta name="theme-color" content="#faf8f6">
<style>
:root{--ink:#141414;--paper:#faf8f6;--gray:#8f8b86;--line:#eae6e2;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Helvetica Neue",sans-serif;overflow:hidden;}
.serif{font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);}
.topbar{flex:0 0 auto;min-height:58px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 18px 12px;}
.title-wrap{display:flex;align-items:baseline;gap:8px;min-width:0;}
h1{margin:0;font-size:20px;letter-spacing:.08em;font-weight:600;white-space:nowrap;}
.count{font-size:11px;color:var(--gray);letter-spacing:.06em;white-space:nowrap;}
.bgm-btn{border:1px solid var(--line);background:#fff;color:var(--ink);width:30px;height:30px;border-radius:50%;font-size:14px;line-height:1;flex:0 0 auto;margin-right:8px;}
.bgm-btn.off{color:#c7c2bc;border-color:#eae6e2;}
.add-btn{border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:12px;letter-spacing:.1em;padding:8px 14px;border-radius:20px;flex:0 0 auto;}
.album-tabs{flex:0 0 auto;display:flex;gap:8px;padding:0 18px 12px;overflow-x:auto;scrollbar-width:none;}
.album-tabs::-webkit-scrollbar{display:none;}
.atab{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#777;font-size:12px;padding:6px 14px;border-radius:20px;letter-spacing:.04em;}
.atab.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.atab.new{color:#999;border-style:dashed;}
.atab .n{font-size:10px;opacity:.6;margin-left:4px;}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 110px;}
.grid{column-count:2;column-gap:8px;}
.item{break-inside:avoid;margin-bottom:8px;border-radius:10px;overflow:hidden;position:relative;background:#eee;box-shadow:0 2px 10px rgba(20,20,20,.06);}
.item img{width:100%;display:block;}
.item .tag{position:absolute;left:8px;top:8px;font-size:10px;color:#fff;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:10px;}
.item .sticker-peek{position:absolute;inset:0;pointer-events:none;}
.empty{text-align:center;color:#b8b3ad;padding:56px 20px;}
.empty .big{font-size:42px;margin-bottom:12px;filter:grayscale(1);opacity:.35;}
.empty p{font-size:13px;letter-spacing:.1em;line-height:2;}
.empty button{margin-top:16px;border:1px solid var(--ink);background:#fff;color:var(--ink);padding:10px 22px;border-radius:24px;font-size:13px;letter-spacing:.1em;}
.viewer{position:fixed;inset:0;background:#0d0d0d;z-index:60;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);}
.vhead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;color:#fff;}
.vhead button{background:none;border:none;color:#fff;font-size:13px;letter-spacing:.04em;padding:8px;}
.vhead .vinfo{font-size:11px;color:#999;letter-spacing:.04em;text-align:center;flex:1;}
.vstage{flex:1;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:4px 0 8px;}
.canvas-wrap{position:relative;line-height:0;max-width:100%;}
.canvas-wrap img{max-width:100%;display:block;}
.sticker-layer{position:absolute;inset:0;}
.sticker{position:absolute;transform:translate(-50%,-50%);line-height:1;touch-action:none;}
.sticker.sel{outline:1px dashed rgba(255,255,255,.9);outline-offset:2px;border-radius:4px;}
.vebar{flex:0 0 auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#141414;}
.panel{display:none;}
.panel.on{display:block;}
.palette{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;}
.palette::-webkit-scrollbar{display:none;}
.palette button{flex:0 0 auto;width:44px;height:44px;font-size:24px;line-height:1;border:none;border-radius:10px;background:#232323;}
.panel.row{display:flex;align-items:center;gap:10px;color:#aaa;font-size:12px;}
.panel.row.on{display:flex;}
input[type=range]{flex:1;accent-color:#fff;}
.mini{border:1px solid #3a3a3a;background:#1e1e1e;color:#ddd;font-size:12px;padding:7px 12px;border-radius:16px;}
.mini.danger{color:#ff8a80;}
.actions{display:flex;gap:6px;justify-content:space-between;align-items:center;margin-top:6px;}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;display:flex;align-items:flex-end;}
.sheet-inner{width:100%;background:#fff;border-radius:16px 16px 0 0;padding:16px 18px calc(16px + env(safe-area-inset-bottom));}
.sheet h3{margin:0 0 12px;font-size:13px;letter-spacing:.08em;color:#666;font-weight:400;}
.sheet .row{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line);font-size:14px;}
.sheet .row:last-child{border-bottom:none;}
.sheet .row .go{color:#aaa;font-size:12px;}
.lock{position:fixed;inset:0;background:var(--paper);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px calc(24px + env(safe-area-inset-bottom));}
.lock .icon{width:96px;height:96px;border-radius:50%;overflow:hidden;margin-bottom:22px;box-shadow:0 8px 26px rgba(0,0,0,.12);}
.lock .icon img{width:100%;height:100%;object-fit:cover;}
.lock h2{margin:0;font-size:19px;letter-spacing:.14em;font-weight:600;}
.lock .sub{margin:8px 0 22px;font-size:12px;color:var(--gray);letter-spacing:.1em;text-align:center;line-height:1.8;}
.lock .dev{font-size:11px;color:#9a958f;letter-spacing:.14em;margin-bottom:4px;}
.lock .dev b{color:var(--ink);font-weight:600;letter-spacing:.2em;font-size:14px;}
.lock input{width:100%;max-width:300px;text-align:center;letter-spacing:.18em;font-size:15px;border:none;border-bottom:1px solid #cfcac4;background:none;padding:10px 0;outline:none;margin:8px 0 18px;text-transform:uppercase;}
.lock .go{width:100%;max-width:300px;background:var(--ink);color:#fff;border:none;padding:13px;border-radius:24px;letter-spacing:.2em;font-size:14px;}
.lock .err{height:16px;margin-top:12px;font-size:11.5px;color:#c0554f;letter-spacing:.06em;}
.lock .foot{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));font-size:10.5px;color:#b0aba5;letter-spacing:.1em;}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(250,248,246,.96);color:#141414;font-size:12px;letter-spacing:.08em;padding:9px 18px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,.18);}
.toast.show{opacity:1;}
.progress{position:fixed;inset:0;background:rgba(250,248,246,.88);z-index:95;display:none;flex-direction:column;gap:12px;align-items:center;justify-content:center;color:#141414;font-size:13px;letter-spacing:.1em;}
.progress.on{display:flex;}
</style>
</head>
<body>
<div id="app" style="visibility:hidden">
  <div class="topbar">
    <div class="title-wrap">
      <h1 class="serif" id="appTitle">周盼盼的小相册</h1>
      <span class="count" id="count"></span>
    </div>
    <div style="display:flex;align-items:center"><button class="bgm-btn" id="bgmBtn">♪</button><button class="add-btn" id="addBtn">＋ 照片</button></div>
  </div>
  <div class="album-tabs" id="albumTabs"></div>
  <div class="content" id="content"></div>
</div>
<div class="toast" id="toast"></div>
<div class="progress" id="progress">正在处理⋯⋯</div>
<audio id="bgm" loop preload="auto" src="audio/bgm.mp3"></audio>

<script src="seed.js"></script>
<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var db=null, photos=[], current=null, selSticker=null;
  var ALBUMS_KEY='album_groups_v2', ACT_KEY='activated_v2';
  var albums=[], curAlbum='__all__';
  var STICKERS=['🐱','🐶','🌸','⭐️','💖','🎀','🍓','✨','🥺','😂','☁️','🐰','🌙','🍀','🎧','🕶️','🎈','🦋'];

  /* ---------- 激活算法（与 keygen 一致） ---------- */
  var ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function fnv(str){
    var h=2166136261>>>0;
    for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=(h*16777619)>>>0;}
    return h>>>0;
  }
  function hx(str,n){var out='';for(var i=0;i<n;i++){out+=ALPHA[fnv(str+'#'+i)&31];}return out;}
  function norm(s){return (s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
  function deviceCode(){
    var id='';
    try{ if(window.Device&&window.Device.getDeviceId) id=window.Device.getDeviceId(); }catch(e){}
    if(!id){ id=localStorage.getItem('fallback_dev'); if(!id){id='F'+Math.random().toString(36).slice(2,10);localStorage.setItem('fallback_dev',id);} }
    var c=hx('dev|'+id,8);
    return c.slice(0,4)+'-'+c.slice(4,8);
  }
  function genCode(dev){
    var c=hx('zpp|'+norm(dev),16);
    return c.slice(0,4)+'-'+c.slice(4,8)+'-'+c.slice(8,12)+'-'+c.slice(12,16);
  }
  var PASSWORD='ZPP100101';
  function checkCode(input){
    var v=norm(input);
    if(v===PASSWORD)return 'MASTER';
    return '';
  }

  /* ---------- 启动激活 ---------- */
  function boot(){
    var saved=localStorage.getItem(ACT_KEY);
    if(saved==='MASTER'){start();return;}
    renderLock();
  }
  function renderLock(){
    var el=document.createElement('div');el.className='lock';el.id='lock';
    el.innerHTML='<div class="icon"><img src="icon.png"></div>'
      +'<h2 class="serif">周盼盼的小相册</h2>'
      +'<div class="sub">私密相册<br>输入密码进入</div>'
      +'<input id="actInput" placeholder="请输入密码" autocomplete="off">'
      +'<button class="go" id="actGo">进　入</button>'
      +'<div class="err" id="actErr"></div>'
      +'<div class="foot">密码仅本机校验，不联网</div>';
    document.body.appendChild(el);
    $('actGo').addEventListener('click',tryActivate);
    $('actInput').addEventListener('input',function(){
      this.value=this.value.replace(/[^A-Za-z0-9]/g,'').slice(0,16);
    });
    $('actInput').addEventListener('keydown',function(e){if(e.key==='Enter')tryActivate();});
  }
  function tryActivate(){
    var v=$('actInput').value.trim();
    if(!v){$('actErr').textContent='请输入密码';return;}
    var res=checkCode(v);
    if(res){
      localStorage.setItem(ACT_KEY,'MASTER');
      var l=$('lock');if(l&&l.parentNode)l.parentNode.removeChild(l);
      start();
    }else{
      $('actErr').textContent='密码不正确';
    }
  }

  /* ---------- IndexedDB ---------- */
  function openDB(cb){
    var req=indexedDB.open('albumDB',1);
    req.onupgradeneeded=function(e){
      var d=e.target.result;
      if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});
    };
    req.onsuccess=function(e){db=e.target.result;cb();};
    req.onerror=function(){toast('存储初始化失败');};
  }
  function allPhotos(cb){
    var tx=db.transaction('photos','readonly').objectStore('photos').getAll();
    tx.onsuccess=function(){photos=(tx.result||[]).sort(function(a,b){return b.created-a.created;});cb();};
  }
  function putPhoto(p,cb){
    var st=db.transaction('photos','readwrite').objectStore('photos').put(p);
    st.onsuccess=function(){if(cb)cb();};
  }
  function delPhoto(id,cb){
    var st=db.transaction('photos','readwrite').objectStore('photos').delete(id);
    st.onsuccess=function(){if(cb)cb();};
  }
  function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},1700);}

  /* ---------- 相簿 ---------- */
  function loadAlbums(){
    try{albums=JSON.parse(localStorage.getItem(ALBUMS_KEY)||'null')||['日常','表情包'];}
    catch(e){albums=['日常','表情包'];}
    if(!albums.length)albums=['日常'];
  }
  function saveAlbums(){try{localStorage.setItem(ALBUMS_KEY,JSON.stringify(albums));}catch(e){}}

  function renderTabs(){
    var html='<button class="atab'+(curAlbum==='__all__'?' on':'')+'" data-a="__all__">全部<span class="n">'+photos.length+'</span></button>';
    albums.forEach(function(a){
      var n=photos.filter(function(p){return p.album===a;}).length;
      html+='<button class="atab'+(curAlbum===a?' on':'')+'" data-a="'+esc(a)+'">'+esc(a)+'<span class="n">'+n+'</span></button>';
    });
    html+='<button class="atab new" id="newAlbum">＋ 相簿</button>';
    $('albumTabs').innerHTML=html;
    Array.prototype.forEach.call(document.querySelectorAll('[data-a]'),function(b){
      b.addEventListener('click',function(){curAlbum=this.getAttribute('data-a');render();});
    });
    $('newAlbum').addEventListener('click',function(){
      var name=prompt('新相簿名字');if(!name)return;
      name=name.trim().slice(0,8);
      if(!name)return;
      if(albums.indexOf(name)<0){albums.push(name);saveAlbums();}
      curAlbum=name;render();toast('已创建「'+name+'」');
    });
  }

  /* ---------- 列表 ---------- */
  function render(){
    renderTabs();
    var list=curAlbum==='__all__'?photos:photos.filter(function(p){return p.album===curAlbum;});
    $('count').textContent=(curAlbum==='__all__'?'':curAlbum+'　')+list.length+' 张';
    if(!list.length){
      $('content').innerHTML='<div class="empty"><div class="big">🖼️</div>'
        +'<p>'+(curAlbum==='__all__'?'相册还是空的<br>把喜欢的照片都放进来':'这个相簿还没有照片')+'</p>'
        +'<button id="emptyAdd">添加照片</button></div>';
      $('emptyAdd').addEventListener('click',pickPhotos);
      return;
    }
    var html='<div class="grid">';
    list.forEach(function(p){
      var peek=(p.stickers||[]).slice(0,4).map(function(s){
        return '<span style="position:absolute;left:'+s.x+'%;top:'+s.y+'%;transform:translate(-50%,-50%);font-size:'+(s.size*14)+'px;">'+s.emoji+'</span>';
      }).join('');
      html+='<div class="item" data-id="'+p.id+'"><img src="'+p.src+'" loading="lazy">'
        +(peek?'<div class="sticker-peek">'+peek+'</div>':'')
        +((p.stickers&&p.stickers.length>=3)?'<span class="tag">'+(p.stickers.length)+'</span>':'')
        +'</div>';
    });
    html+='</div>';
    $('content').innerHTML=html;
    Array.prototype.forEach.call(document.querySelectorAll('.item'),function(el){
      el.addEventListener('click',function(){openViewer(this.getAttribute('data-id'));});
    });
  }

  /* ---------- 选图 ---------- */
  function pickPhotos(){
    var inp=document.createElement('input');
    inp.type='file';inp.accept='image/*';inp.multiple=true;
    inp.style.cssText='position:fixed;left:-9999px;';
    document.body.appendChild(inp);
    inp.addEventListener('change',function(){
      var files=Array.prototype.slice.call(inp.files||[]);
      if(!files.length){document.body.removeChild(inp);return;}
      var target=curAlbum==='__all__'?(albums[0]||'日常'):curAlbum;
      $('progress').classList.add('on');$('progress').textContent='正在导入 0/'+files.length;
      var done=0;
      var next=function(){
        if(done>=files.length){
          document.body.removeChild(inp);
          $('progress').classList.remove('on');
          allPhotos(render);toast('已添加 '+done+' 张到「'+target+'」');
          return;
        }
        var f=files[done];
        var reader=new FileReader();
        reader.onload=function(){
          compress(reader.result,function(data,w,h){
            var p={id:'p'+Date.now()+'_'+done,src:data,w:w,h:h,created:Date.now()+done,album:target,stickers:[]};
            putPhoto(p,function(){done++;$('progress').textContent='正在导入 '+done+'/'+files.length;next();});
          });
        };
        reader.onerror=function(){done++;next();};
        reader.readAsDataURL(f);
      };
      next();
    });
    inp.click();
  }

  function compress(url,cb){
    var img=new Image();
    img.onload=function(){
      var max=1600,w=img.width,h=img.height;
      if(Math.max(w,h)>max){var r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.82),w,h);
    };
    img.onerror=function(){cb(url,0,0);};
    img.src=url;
  }

  /* ---------- 查看器 ---------- */
  function openViewer(id){
    var p=photos.filter(function(x){return x.id===id;})[0];if(!p)return;
    current=p;selSticker=null;
    var el=document.createElement('div');el.className='viewer';el.id='viewer';
    el.innerHTML='<div class="vhead"><button id="vClose">✕ 关闭</button>'
      +'<div class="vinfo" id="vInfo"></div>'
      +'<button id="vSave">保存图片</button></div>'
      +'<div class="vstage"><div class="canvas-wrap" id="wrap"><img src="'+p.src+'" id="vImg">'
      +'<div class="sticker-layer" id="layer"></div></div></div>'
      +'<div class="vebar">'
      +'<div class="panel" id="palettePanel"><div class="palette">'
      +STICKERS.map(function(s){return '<button data-emoji="'+s+'">'+s+'</button>';}).join('')
      +'</div></div>'
      +'<div class="panel row" id="sizePanel"><span>大小</span>'
      +'<input type="range" id="sizeRange" min="0.6" max="3.2" step="0.1" value="1">'
      +'<button class="mini danger" id="delSticker">删除</button></div>'
      +'<div class="actions"><button class="mini" id="toggleStickers">＋ 贴纸</button>'
      +'<button class="mini" id="moveAlbum">移到相簿</button>'
      +'<button class="mini danger" id="delPhoto">删除照片</button></div>'
      +'</div>';
    document.body.appendChild(el);
    $('vClose').addEventListener('click',closeViewer);
    $('vSave').addEventListener('click',saveComposite);
    $('delPhoto').addEventListener('click',function(){
      if(confirm('确定要删除这张照片吗？')){
        delPhoto(current.id,function(){closeViewer();allPhotos(render);toast('已删除');});
      }
    });
    $('moveAlbum').addEventListener('click',openMoveSheet);
    $('toggleStickers').addEventListener('click',function(){
      var pp=$('palettePanel');
      pp.classList.toggle('on');
      this.textContent=pp.classList.contains('on')?'− 收起贴纸':'＋ 贴纸';
      if(pp.classList.contains('on'))$('sizePanel').classList.remove('on');
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-emoji]'),function(b){
      b.addEventListener('click',function(){addSticker(this.getAttribute('data-emoji'));});
    });
    $('sizeRange').addEventListener('input',function(){
      if(!selSticker)return;
      selSticker.size=parseFloat(this.value);
      renderStickers();
    });
    $('delSticker').addEventListener('click',function(){
      if(!selSticker)return;
      current.stickers=current.stickers.filter(function(s){return s!==selSticker;});
      selSticker=null;$('sizePanel').classList.remove('on');renderStickers();
      putPhoto(current,function(){});
    });
    renderStickers();updateInfo();
  }

  function updateInfo(){
    var d=new Date(current.created);
    $('vInfo').textContent=(current.album||'日常')+'　'+d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())
      +'　'+((current.stickers&&current.stickers.length)||0)+' 贴纸';
  }
  function pad(n){return n<10?'0'+n:''+n;}

  function renderStickers(){
    var layer=$('layer');if(!layer)return;
    var wpx=$('vImg').clientWidth||300, base=wpx*0.13;
    layer.innerHTML='';
    (current.stickers||[]).forEach(function(s){
      var el=document.createElement('div');
      el.className='sticker'+(s===selSticker?' sel':'');
      el.style.left=s.x+'%';el.style.top=s.y+'%';
      el.style.fontSize=(base*s.size)+'px';
      el.textContent=s.emoji;
      layer.appendChild(el);
      bindDrag(el,s);
    });
  }

  function addSticker(emoji){
    if(!current.stickers)current.stickers=[];
    var s={emoji:emoji,x:50,y:50,size:1};
    current.stickers.push(s);selSticker=s;
    renderStickers();$('sizePanel').classList.add('on');$('sizeRange').value=1;updateInfo();
  }

  function bindDrag(el,s){
    var dragging=false,rect=null,sx=0,sy=0,bx=0,by=0;
    el.addEventListener('pointerdown',function(e){
      e.preventDefault();e.stopPropagation();
      selSticker=s;
      Array.prototype.forEach.call(document.querySelectorAll('.sticker'),function(x){x.classList.remove('sel');});
      el.classList.add('sel');
      $('sizePanel').classList.add('on');$('sizeRange').value=s.size;
      dragging=true;rect=el.parentNode.getBoundingClientRect();
      sx=e.clientX;sy=e.clientY;bx=s.x;by=s.y;
      if(el.setPointerCapture)try{el.setPointerCapture(e.pointerId);}catch(_){}
    });
    el.addEventListener('pointermove',function(e){
      if(!dragging||!rect)return;
      s.x=Math.max(0,Math.min(100,bx+((e.clientX-sx)/rect.width*100)));
      s.y=Math.max(0,Math.min(100,by+((e.clientY-sy)/rect.height*100)));
      el.style.left=s.x+'%';el.style.top=s.y+'%';
    });
    el.addEventListener('pointerup',function(){if(!dragging)return;dragging=false;putPhoto(current,function(){});});
    el.addEventListener('pointercancel',function(){dragging=false;});
  }

  function openMoveSheet(){
    var el=document.createElement('div');el.className='sheet';el.id='moveSheet';
    var html='<div class="sheet-inner"><h3>移到哪个相簿</h3>';
    albums.forEach(function(a){
      html+='<div class="row" data-to="'+esc(a)+'"><span>'+esc(a)+'</span><span class="go">'+(current.album===a?'当前':'›')+'</span></div>';
    });
    html+='<div class="row" data-new="1"><span>＋ 新建相簿</span><span class="go">›</span></div></div>';
    el.innerHTML=html;
    document.body.appendChild(el);
    el.addEventListener('click',function(e){if(e.target===el)closeSheet();});
    Array.prototype.forEach.call(el.querySelectorAll('[data-to]'),function(r){
      r.addEventListener('click',function(){
        current.album=this.getAttribute('data-to');
        putPhoto(current,function(){closeSheet();updateInfo();allPhotos(render);toast('已移到「'+current.album+'」');});
      });
    });
    el.querySelector('[data-new]').addEventListener('click',function(){
      var name=prompt('新相簿名字');if(!name)return;
      name=name.trim().slice(0,8);if(!name)return;
      if(albums.indexOf(name)<0){albums.push(name);saveAlbums();}
      current.album=name;
      putPhoto(current,function(){closeSheet();updateInfo();allPhotos(render);toast('已移到「'+name+'」');});
    });
  }
  function closeSheet(){var s=$('moveSheet');if(s&&s.parentNode)s.parentNode.removeChild(s);}
  function closeViewer(){
    closeSheet();
    var v=$('viewer');if(v&&v.parentNode)v.parentNode.removeChild(v);
    current=null;selSticker=null;
  }

  /* ---------- 导出合成图 ---------- */
  function saveComposite(){
    $('progress').classList.add('on');$('progress').textContent='正在合成⋯⋯';
    var img=$('vImg'), W=img.naturalWidth, H=img.naturalHeight;
    var c=document.createElement('canvas');c.width=W;c.height=H;
    var ctx=c.getContext('2d');
    ctx.drawImage(img,0,0,W,H);
    (current.stickers||[]).forEach(function(s){
      var size=W*0.13*s.size;
      ctx.font=size+'px "Apple Color Emoji","Noto Color Emoji",sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(s.emoji,s.x/100*W,s.y/100*H);
    });
    var data=c.toDataURL('image/jpeg',0.92);
    setTimeout(function(){
      var ok=false;
      try{ if(window.Android&&window.Android.saveImage)ok=window.Android.saveImage(data,'album_'+current.id); }catch(e){}
      $('progress').classList.remove('on');
      toast(ok?'已保存到手机相册':'保存失败，请检查权限');
    },60);
  }

  /* ---------- 内置图片 ---------- */
  function seed(cb){
    if(localStorage.getItem('seeded_v2'))return cb();
    var list=window.SEED_PHOTOS||[], i=0;
    var next=function(){
      if(i>=list.length){localStorage.setItem('seeded_v2','1');return cb();}
      var s=list[i];
      var p={id:'seed_'+i,src:s.src,w:s.w||0,h:s.h||0,created:Date.now()-i*1000,album:s.album||'日常',stickers:[]};
      i++;putPhoto(p,next);
    };
    next();
  }

  function openUpdateSheet(){
    if($('updateSheet'))return;
    var cur='';
    try{ if(window.Updater&&window.Updater.getUpdateUrl)cur=window.Updater.getUpdateUrl(); }catch(e){}
    var el=document.createElement('div');el.className='sheet';el.id='updateSheet';
    el.innerHTML='<div class="sheet-inner"><h3>云更新设置</h3>'
      +'<div style="font-size:12px;color:#999;line-height:1.8;margin-bottom:10px">填写 version.json 的完整链接，例如<br>https://xxx.github.io/album/version.json</div>'
      +'<input id="upUrl" placeholder="https://…/version.json" value="'+esc(cur)+'" '
      +'style="width:100%;border:none;border-bottom:1px solid #e6e1db;background:none;padding:9px 0;font-size:13px;outline:none">'
      +'<div style="display:flex;gap:10px;margin-top:16px">'
      +'<button class="mini" id="upSave" style="flex:1;border-color:#ddd;background:#fff;color:#333">保存</button>'
      +'<button class="mini" id="upCheck" style="flex:1;background:#141414;color:#fff;border-color:#141414">检查更新</button>'
      +'</div></div>';
    document.body.appendChild(el);
    el.addEventListener('click',function(e){if(e.target===el)closeUpdateSheet();});
    $('upSave').addEventListener('click',function(){
      var u=$('upUrl').value.trim();
      try{ if(window.Updater&&window.Updater.setUpdateUrl)window.Updater.setUpdateUrl(u); }catch(e){}
      closeUpdateSheet();toast('已保存更新地址');
    });
    $('upCheck').addEventListener('click',function(){
      var u=$('upUrl').value.trim();
      try{
        if(window.Updater&&window.Updater.setUpdateUrl)window.Updater.setUpdateUrl(u);
        if(window.Updater&&window.Updater.checkNow)window.Updater.checkNow();
        closeUpdateSheet();
      }catch(e){toast('当前环境不支持云更新');}
    });
  }
  function closeUpdateSheet(){var s=$('updateSheet');if(s&&s.parentNode)s.parentNode.removeChild(s);}

  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

  /* ---------- 入口 ---------- */
  function playBgm(){
    var a=$('bgm'); if(!a)return;
    a.volume=0.42;
    var p;
    try{p=a.play();}catch(e){return;}
    if(p&&p.catch){p.catch(function(){
      var once=function(){
        document.removeEventListener('touchstart',once);
        document.removeEventListener('click',once);
        try{a.play();}catch(e){}
      };
      document.addEventListener('touchstart',once);
      document.addEventListener('click',once);
    });}
  }
  function start(){
    $('app').style.visibility='visible';
    $('addBtn').addEventListener('click',pickPhotos);
    var title=$('appTitle');
    if(title){
      var pressTimer=null;
      var startPress=function(){pressTimer=setTimeout(openUpdateSheet,550);};
      var endPress=function(){if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}};
      title.addEventListener('touchstart',startPress);
      title.addEventListener('touchend',endPress);
      title.addEventListener('touchmove',endPress);
      title.addEventListener('touchcancel',endPress);
      title.addEventListener('mousedown',startPress);
      title.addEventListener('mouseup',endPress);
      title.addEventListener('mouseleave',endPress);
    }
    var btn=$('bgmBtn');
    var off=localStorage.getItem('bgm_off')==='1';
    btn.classList.toggle('off',off);
    if(!off)playBgm();
    btn.addEventListener('click',function(){
      var a=$('bgm');var nowOff=!a.paused;
      if(nowOff){a.pause();a.currentTime=0;}else{playBgm();}
      btn.classList.toggle('off',nowOff);
      localStorage.setItem('bgm_off',nowOff?'1':'0');
    });
    loadAlbums();
    openDB(function(){ seed(function(){ allPhotos(render); }); });
  }
  window.__albumBack=function(){
    if($('updateSheet')){closeUpdateSheet();return true;}
    if($('moveSheet')){closeSheet();return true;}
    if($('viewer')){closeViewer();return true;}
    return false;
  };
  window.__albumDeviceCode=function(){return deviceCode();};
  boot();
})();
</script>
</body>
</html>
